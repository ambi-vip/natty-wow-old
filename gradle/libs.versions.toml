[versions]
# libraries
spring-boot = "4.1.1"
cosid = "3.2.1"
wow = "9.0.8"
coapi = "2.2.0"
cocache = "4.3.0"
cosec = "5.2.0"
cosky = "5.8.1"
simba = "3.1.3"
guava = "33.4.8-jre"
swagger = "2.2.30"
hamcrest = "3.0"
mockk = "1.14.0"
detekt-formatting = "1.23.8"
springdoc = "3.1.0"
# plugins
detekt = "1.23.8"
dokka = "2.0.0"
kotlin = "2.1.20"
publish-plugin = "2.0.0"
ksp = "2.1.20-2.0.0"
kover = "0.9.1"
test-retry = "1.6.2"
casdoor = "1.15.0"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
cosid-bom = { module = "me.ahoo.cosid:cosid-bom", version.ref = "cosid" }
wow-bom = { module = "me.ahoo.wow:wow-bom", version.ref = "wow" }
coapi-bom = { module = "me.ahoo.coapi:coapi-bom", version.ref = "coapi" }
cocache-bom = { module = "me.ahoo.cocache:cocache-bom", version.ref = "cocache" }
cosec-bom = { module = "me.ahoo.cosec:cosec-bom", version.ref = "cosec" }
cosky-bom = { module = "me.ahoo.cosky:cosky-bom", version.ref = "cosky" }
simba-bom = { module = "me.ahoo.simba:simba-bom", version.ref = "simba" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
swagger-annotations = { module = "io.swagger.core.v3:swagger-annotations", version.ref = "swagger" }
springdoc-openapi-starter-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt-formatting" }
casdoor = { module = "org.casbin:casdoor-spring-boot-starter", version.ref = "casdoor" }

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
publish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "publish-plugin" }
test-retry = { id = "org.gradle.test-retry", version.ref = "test-retry" }

